name: Pilot Media Monitor

on:
  workflow_dispatch:
  push:
    paths:
      - "config/sources.yml"
      - "scripts/collect_news.py"
      - "requirements.txt"
      - ".github/workflows/pilot-monitor.yml"

jobs:
  collect:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Collect pilot news
        run: python scripts/collect_news.py config/sources.yml exports

      - name: Upload monitoring output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pilot-monitor-output
          path: exports/
          if-no-files-found: warn
